# 单元测试：内存 H2（MySQL 兼容模式），由 JPA 根据实体建表
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

# 测试用 JWT 密钥（长度满足 HS256 要求，勿用于生产）
app:
  jwt:
    secret-key: "test-jwt-secret-do-not-use-in-production-32chars-min!!"
    refresh-token-expire-days: 7
