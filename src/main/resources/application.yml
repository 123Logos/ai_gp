spring:
  application:
    name: ai-growth-plan
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:aigp_test1}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8000}

app:
  jwt:
    secret-key: ${JWT_SECRET_KEY:}
    access-token-expire-minutes: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:1440}
  admin:
    bootstrap:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:123456}
  llm:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${LLM_MODEL:qwen3.5-flash}
  vlm:
    api-key: ${VLM_API_KEY:}
    base-url: ${VLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${VLM_MODEL:qwen-vl-max-latest}
